<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOUND ROOM · 끊김 없는 흐름 비교</title>
<style>
@font-face{font-family:Pretendard;src:url(../splash-film-v1/Pretendard-Regular.otf)}
*{box-sizing:border-box}body{background:#242030;color:#eee8fc;margin:0;font-family:Pretendard,sans-serif}main{max-width:450px;margin:auto;padding:20px 18px}h1{font-size:20px}p{font-size:14px;line-height:1.6}select,button,a{font:inherit;border:1px solid #9c90ab;border-radius:12px;padding:12px;color:inherit;background:#41374e;text-decoration:none}select{width:100%;margin:8px 0}.phone{position:relative;aspect-ratio:390/844;border-radius:24px;overflow:hidden;background:#2b263f;isolation:isolate}video,.tone{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tone{background:linear-gradient(#e7e4f6a6,#aebff08c 45%,#bfb4e4bf);mix-blend-mode:screen;pointer-events:none}.dark .tone{background:linear-gradient(#2b263f66,#39314633 45%,#3a344c99);mix-blend-mode:normal}.titles{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;pointer-events:none;color:white}.titles strong{font-size:40px;font-weight:400}.titles span{font-size:14px}.buttons{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
</style><main><h1>정방향 · 왕복 재생 비교</h1><p>수정본도 정방향 → 역방향 → 정방향으로 반복됩니다. 감속 없이 재생하며, 멈춰 보이는 구간을 줄이기 위해 전환을 0.25초로 줄이고 겹치는 비율을 조정했습니다. 아래에서 정방향 및 이전 왕복 버전과 비교해 보세요. 앱 시작 화면에는 정방향 버전이 유지됩니다.</p><select id="version" aria-label="비교할 영상"><option value="pingpong-short-blend.mp4">수정본 · 짧게 연결한 정·역방향 (19.5초)</option><option value="reverse-flow.mp4">이전 · 1초 겹침 왕복 (18초)</option><option value="pingpong.mp4">비교용 · 정방향 → 역재생 (약 20초)</option><option value="forward.mp4">현재 앱 · 정방향 연결 (9초)</option><option value="previous.mp4">이전 버전 · 감속 왕복 (22초)</option></select><div class="phone"><video id="film" src="pingpong-short-blend.mp4" muted autoplay loop playsinline preload="auto"></video><div class="tone"></div><div class="titles"><strong>Sound Room</strong><span>소리로 만드는 나만의 작은 꿈속 공간</span></div></div><div class="buttons"><button id="play">일시정지</button><button id="theme">다크로 보기</button><a id="download" href="pingpong-short-blend.mp4" download>영상 다운로드</a></div><p id="status" aria-live="polite"></p></main>
<script>
const film=document.querySelector('#film'),play=document.querySelector('#play'),theme=document.querySelector('#theme'),phone=document.querySelector('.phone'),status=document.querySelector('#status');
function sync(){play.textContent=film.paused?'재생':'일시정지'}async function start(){try{await film.play();status.textContent=''}catch{status.textContent='재생 버튼을 눌러 확인해 주세요.'}sync()}
film.onplay=sync;film.onpause=sync;play.onclick=()=>film.paused?start():film.pause();
const version=document.querySelector('#version');
function selectClip(value){version.value=value;film.src=value;document.querySelector('#download').href=value;film.load();start()}
version.onchange=e=>selectClip(e.target.value);
const requested=new URLSearchParams(location.search).get('clip');
if(['forward','pingpong-short-blend','reverse-flow','pingpong','previous'].includes(requested))selectClip(requested+'.mp4');
theme.onclick=()=>{phone.classList.toggle('dark');theme.textContent=phone.classList.contains('dark')?'라이트로 보기':'다크로 보기'};
try{if(JSON.parse(localStorage.getItem('sound-room.confirmed-design.v1')||'{}').dark)theme.click()}catch{}
document.addEventListener('visibilitychange',()=>{if(document.hidden)film.pause()});start();
</script></html>
