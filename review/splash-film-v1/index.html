<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOUND ROOM · 영상 검토 1</title>
<style>
@font-face{font-family:Pretendard;src:url(Pretendard-Regular.otf)}*{box-sizing:border-box}body{margin:0;background:#201e2d;color:#f6efff;font-family:Pretendard,sans-serif}main{max-width:450px;margin:auto;padding:20px 18px}h1{font-size:20px;margin:0 0 8px}p{font-size:14px;line-height:1.6;color:#d4cadf}.phone{position:relative;width:100%;aspect-ratio:390/844;overflow:hidden;border-radius:24px;background:#332f49}.phone video,.phone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.phone img{filter:saturate(.86)}[hidden]{display:none!important}.titles{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none;color:white}.titles strong{font-size:40px;font-weight:400}.titles span{font-size:14px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,a{font:inherit;font-size:14px;border:1px solid #8d809f;border-radius:12px;padding:12px;background:#3b344d;color:#fff;text-decoration:none;cursor:pointer}.note{font-size:13px}#status{min-height:22px}
</style><main><h1>SOUND ROOM · 영상 샘플 1</h1><p>10초 무음 반복 영상입니다. 원본과 번갈아 보며 빛의 변화와 구도를 확인해 주세요.</p><div class="phone"><video id="film" src="splash-light-v1.mp4" muted autoplay loop playsinline preload="auto" poster="original.png"></video><img id="still" src="original.png" hidden alt="원본 시작 화면"><div class="titles"><strong>Sound Room</strong><span>소리로 만드는 나만의 작은 꿈속 공간</span></div></div><div class="buttons"><button id="play">일시정지</button><button id="compare">원본 보기</button><a href="splash-light-v1.mp4" download>MP4 다운로드</a></div><p id="status" aria-live="polite">영상 재생 중</p><p class="note">별 · 달빛 · 윤슬의 빛 효과만 움직입니다. 구름과 배의 형태·위치는 고정한 원본 보존 샘플이며, 앱에 적용된 상태는 아닙니다.</p></main>
<script>
const film=document.querySelector('#film'),still=document.querySelector('#still'),play=document.querySelector('#play'),compare=document.querySelector('#compare'),status=document.querySelector('#status');
function sync(){play.textContent=film.paused?'영상 재생':'일시정지';status.textContent=!still.hidden?'원본 이미지':film.paused?'영상 일시정지':'영상 재생 중'}
async function start(){try{await film.play()}catch{status.textContent='영상 재생을 눌러 확인해 주세요.'}sync()}
film.addEventListener('play',sync);film.addEventListener('pause',sync);
play.onclick=()=>{still.hidden=true;compare.textContent='원본 보기';film.paused?start():film.pause()};
compare.onclick=()=>{still.hidden=!still.hidden;compare.textContent=still.hidden?'원본 보기':'영상 보기';if(still.hidden)start();else film.pause();sync()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)film.pause()});start();
</script></html>
