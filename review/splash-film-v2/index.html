<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOUND ROOM · 영상 검토 2</title>
<style>
@font-face{font-family:Pretendard;src:url(../splash-film-v1/Pretendard-Regular.otf)}*{box-sizing:border-box}body{margin:0;background:#201e2d;color:#f6efff;font-family:Pretendard,sans-serif}main{max-width:450px;margin:auto;padding:20px 18px}h1{font-size:20px;margin:0 0 8px}p{font-size:14px;line-height:1.6;color:#d4cadf}.phone{position:relative;width:100%;aspect-ratio:390/844;overflow:hidden;border-radius:24px;background:#332f49}.phone video,.phone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.phone img{filter:saturate(.86)}[hidden]{display:none!important}.titles{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none;color:white}.titles strong{font-size:clamp(32px,10vw,40px);font-weight:400}.titles span{font-size:14px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,a,select{font:inherit;font-size:14px;border:1px solid #8d809f;border-radius:12px;padding:12px;background:#3b344d;color:#fff;text-decoration:none;cursor:pointer}select{width:100%;margin:0 0 16px;min-height:44px}.note{font-size:13px}#status{min-height:22px}
</style><main><h1>SOUND ROOM · 영상 샘플 2</h1><p>빛 효과와 움직임을 비교해 주세요. 원본 보기로 구도와 형태도 확인할 수 있습니다.</p><label for="version">비교할 영상</label><select id="version"><option value="motion">구름 · 배 · 물결 + 반짝임 (새 샘플)</option><option value="lights">별 · 달빛 · 윤슬만 (새 샘플)</option><option value="previous">이전 샘플 1</option></select><div class="phone"><video id="film" src="splash-motion-v2.mp4" muted autoplay loop playsinline preload="auto" poster="../splash-film-v1/original.png"></video><img id="still" src="../splash-film-v1/original.png" hidden alt="원본 시작 화면"><div class="titles"><strong>Sound Room</strong><span>소리로 만드는 나만의 작은 꿈속 공간</span></div></div><div class="buttons"><button id="play">일시정지</button><button id="compare">원본 보기</button><a id="download" href="splash-motion-v2.mp4" download>MP4 다운로드</a></div><p id="status" aria-live="polite">영상 재생 중</p><p class="note">12초 무음 반복 영상입니다. 구름·배·수면을 레이어로 움직이며, 배 뒤쪽의 작은 배경만 보완했습니다. 검토용으로 기존 앱에는 적용하지 않았습니다.</p></main>
<script>
const film=document.querySelector('#film'),still=document.querySelector('#still'),play=document.querySelector('#play'),compare=document.querySelector('#compare'),status=document.querySelector('#status'),version=document.querySelector('#version');
function sync(){play.textContent=film.paused?'영상 재생':'일시정지';status.textContent=!still.hidden?'원본 이미지':film.paused?'영상 일시정지':'영상 재생 중'}
async function start(){try{await film.play();sync()}catch{sync();status.textContent='영상 재생을 눌러 확인해 주세요.'}}
film.addEventListener('play',sync);film.addEventListener('pause',sync);
play.onclick=()=>{still.hidden=true;compare.textContent='원본 보기';film.paused?start():film.pause()};
compare.onclick=()=>{still.hidden=!still.hidden;compare.textContent=still.hidden?'원본 보기':'영상 보기';if(still.hidden)start();else film.pause();sync()};
version.onchange=()=>{film.pause();film.src={motion:'splash-motion-v2.mp4',lights:'splash-lights-v2.mp4',previous:'../splash-film-v1/splash-light-v1.mp4'}[version.value];document.querySelector('#download').href=film.src;still.hidden=true;compare.textContent='원본 보기';film.load();start()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)film.pause()});start();
</script></html>
