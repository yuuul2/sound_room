<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOUND ROOM · 편집용 디자인 검토</title><style>
@font-face{font-family:Pretendard;src:url(../../../assets/fonts/Pretendard-Regular.otf);font-weight:400}@font-face{font-family:Pretendard;src:url(../../../assets/fonts/Pretendard-SemiBold.otf);font-weight:600}*{box-sizing:border-box}body{margin:24px;background:#211e2b;color:#f7f1ff;font:14px/1.5 Pretendard,sans-serif}select{padding:10px;margin:0 8px 16px 0}#screen{position:relative;width:390px;height:844px;overflow:hidden;background:#eee6ff}.layer{position:absolute;box-sizing:border-box}img{display:block}.copy{white-space:pre-wrap;overflow:visible}p{max-width:650px}a{color:#ded0ff}
</style><h1>편집용 화면 검토본</h1><p>완성 시안·원본 에셋을 기준으로 구성한 26개 화면입니다. Figma 실행 전 검토본이며, 시안과 픽셀 단위 일치나 온라인 Figma 작업 완료를 의미하지 않습니다.</p><select id="theme"><option value="light">라이트</option><option value="dark">다크</option></select><select id="select"></select><div id="screen"></div><p id="count"></p><script>
let data;const screen=document.querySelector('#screen'),theme=document.querySelector('#theme'),select=document.querySelector('#select');let layerCount=0;
function fill(v,diagonal=false){return Array.isArray(v)?'linear-gradient(to '+(diagonal?'bottom right':'bottom')+','+v.join(',')+')':v;}
function layer(n,parent){const el=document.createElement(n.type==='image'?'img':'div');el.className='layer '+(n.type==='text'?'copy':'');el.dataset.name=n.name;el.style.cssText=`left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;border-radius:${n.radius||0}px;`;if(n.type==='image'){el.src='../../../'+data.assets[n.asset].path;el.style.objectFit=n.fit==='FIT'?'contain':'cover';el.style.filter=`saturate(${n.saturation??1})`;}else if(n.type==='text'){el.textContent=n.text;Object.assign(el.style,{fontFamily:'Pretendard',fontSize:n.fontSize+'px',lineHeight:n.fontSize*1.35+'px',color:n.color,textAlign:n.align||'left',fontWeight:n.weight==='SemiBold'?'600':'400'});}else if(n.fill)el.style.background=fill(n.fill,n.direction==='diagonal');if(n.rotation)el.style.transform='rotate('+n.rotation+'deg)';if(n.stroke)el.style.border='1px solid '+n.stroke;if(n.blend==='SCREEN')el.style.mixBlendMode='screen';if(n.clip)el.style.overflow='hidden';parent.appendChild(el);layerCount++;for(const c of n.children||[])layer(c,el);}
function render(){screen.replaceChildren();layerCount=0;const s=data.screens.find(s=>s.theme===theme.value&&s.id===select.value);screen.style.background=theme.value==='dark'?'#302a3c':'#eee6ff';for(const n of s.children)layer(n,screen);document.querySelector('#count').textContent=s.name+' · '+layerCount+'개 레이어';window.currentScreen=s;}
(async()=>{data=await(await fetch('../project.json')).json();window.project=data;for(const s of data.screens.filter(s=>s.theme==='light')){const op=new Option(s.name,s.id);select.add(op);}theme.onchange=render;select.onchange=render;render();})();
</script></html>
