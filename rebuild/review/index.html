<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOUND ROOM · 에셋 채도 비교</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eeeaf4;color:#302942;font:14px system-ui}header{padding:20px 28px;background:#fff;position:sticky;top:0;z-index:3;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}button,select{padding:10px;border:1px solid #d5cde4;border-radius:10px;background:#fff}main{display:grid;grid-template-columns:36% 1fr;gap:20px;padding:20px}.reference{position:sticky;top:100px;align-self:start}.reference img{width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:12px;background:#fff;border-radius:14px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}.frame{height:210px;background:repeating-conic-gradient(#ddd3e8 0 25%,#f7f2fc 0 50%) 50%/16px 16px;display:flex;align-items:center;justify-content:center;overflow:hidden}.frame img{width:100%;height:100%;object-fit:contain}.card h2{font-size:12px;overflow-wrap:anywhere}.caption{font-size:11px;color:#746781}.controls{display:flex;align-items:center;gap:8px;margin-top:10px}input{min-width:0;width:100%}.note{padding:0 28px;color:#665c75;line-height:1.6}@media(max-width:700px){main{grid-template-columns:1fr}.reference{position:static}.grid{grid-template-columns:1fr}}</style>
<header><h1>SOUND ROOM · 라이트 에셋 비교</h1><select id="group"><option value="backgrounds_covers">배경·커버</option><option value="sound_mixer">믹서</option><option value="player">플레이어</option><option value="preset_detail">상세 배지</option><option value="onboarding">온보딩</option><option value="ui_icons">아이콘</option></select><select id="reference"><option value="light-core">핵심 완성 시안</option><option value="light-onboarding">온보딩 완성 시안</option><option value="light-explore">탐색·상세·보관함 시안</option><option value="light-settings">마이·시트 시안</option></select><button id="export">보정값 JSON 저장</button></header><p class="note">왼쪽은 완성 시안입니다. 각 에셋의 원본과 표시용 채도 보정을 비교합니다. 원본 PNG의 바이트·크기·투명 배경은 변경하지 않습니다. 조정값은 검토 초안이며 완성 시안과 동일하다고 확정한 값이 아닙니다.</p><main><aside class="reference"><img id="board" src="../reference/light-core.png" alt="완성 시안"></aside><section class="grid" id="grid"></section></main>
<script>
let tones={};const group=document.querySelector('#group'),grid=document.querySelector('#grid');
function render(){grid.replaceChildren();for(const [key,a] of Object.entries(tones)){if(!key.startsWith(group.value+'_'))continue;const card=document.createElement('article');card.className='card';card.dataset.key=key;card.innerHTML=`<h2>${key}</h2><div class="pair"><div><div class="frame"><img src="../${a.path}" alt="원본 ${key}"></div><span class="caption">원본</span></div><div><div class="frame"><img class="adjusted" src="../${a.path}" alt="채도 비교 ${key}"></div><span class="caption">표시용 보정</span></div></div><label class="controls">채도 <input type="range" min="0" max="1" step="0.01" value="${a.saturation}" aria-label="${key} 채도"><output>${a.saturation.toFixed(2)}</output></label>`;const image=card.querySelector('.adjusted');image.style.filter=`saturate(${a.saturation})`;card.querySelector('input').oninput=e=>{a.saturation=Number(e.target.value);a.reviewStatus='draft';image.style.filter=`saturate(${a.saturation})`;card.querySelector('output').value=a.saturation.toFixed(2);};grid.append(card);}}
fetch('./tones.json').then(r=>r.json()).then(data=>{tones=data;render()});group.onchange=render;document.querySelector('#reference').onchange=e=>document.querySelector('#board').src=`../reference/${e.target.value}.png`;document.querySelector('#export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(tones,null,2)],{type:'application/json'}));a.href=url;a.download='light-tones.review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
